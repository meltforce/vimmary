# Build the merge commit and deploy it to production (smokey).
#
# build runs code from the repo and never joins the tailnet. deploy runs in
# the environment `production`, which admits only main: only there does the
# job get an OIDC token that the Tailscale federated identity accepts, and
# with it an ephemeral node tagged tag:gh-deploy. That node may do one thing:
# SSH as `deploy` to smokey, whose login shell accepts `<app> <sha>` and
# hands the image on stdin to pipeline-deploy (homelab repo,
# configuration/pipeline-deploy). Its exit code is the result.
#
# workflow_dispatch with `sha` redeploys a commit, e.g. to roll back further
# than the previous image.
#
# The weekly schedule rebuilds the head of main, because the Dockerfile
# installs yt-dlp unpinned and takes Alpine and Go patch releases from
# floating tags. Its gate runs scripts/lint and scripts/test first; a red
# gate opens an issue labelled rebuild-failed and deploys nothing.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (default: the head of main)"
        required: false
  schedule:
    - cron: "7 5 * * 1"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP: vimmary
  TARGET: smokey.coydog-fence.ts.net

jobs:
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: vimmary
          POSTGRES_PASSWORD: vimmary
          POSTGRES_DB: vimmary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vimmary -d vimmary"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://vimmary:vimmary@localhost:5432/vimmary?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - run: scripts/lint
      - run: scripts/test

  gate-failed:
    needs: gate
    if: failure() && needs.gate.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open issue
        run: |
          {
            echo "The weekly rebuild of \`${GITHUB_SHA:0:7}\` stopped at the gate (scripts/lint, scripts/test); nothing was deployed and production runs the previous image."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "A new advisory (govulncheck) or a new linter finding can fail it without a change in this repo. This issue is the task for the next session: find the cause, fix it in a PR."
          } > issue.md
          gh api "repos/$GITHUB_REPOSITORY/issues" \
            -f title="weekly rebuild failed: ${GITHUB_SHA:0:7}" -F "body=@issue.md" -f 'labels[]=rebuild-failed' --jq .html_url

  build:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # scripts/resolve-sha.sh is tested in the lint check
      # (scripts/resolve-sha_test.sh).
      - name: Resolve commit
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha=$(scripts/resolve-sha.sh "$INPUT_SHA" "$GITHUB_SHA")
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # VERSION is linked into the binary; /version reports it as "build",
      # which is what pipeline-deploy waits for.
      - name: Build image
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          docker build --build-arg "VERSION=$SHA" -t "$APP-local:$SHA" .
          docker save "$APP-local:$SHA" | gzip > image.tar.gz
          ls -lh image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    env:
      SHA: ${{ needs.build.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:gh-deploy

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          gunzip -c image.tar.gz \
            | ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=30 "deploy@$TARGET" "$APP $SHA" 2>&1 \
            | tee deploy.log

      - name: Report live
        if: success()
        run: |
          pr=""
          [ "$GITHUB_EVENT_NAME" = schedule ] || pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
              -f body="live: \`${SHA:0:7}\` is deployed to production ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))." >/dev/null
          fi
          echo "live: ${SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty' || true)
          {
            echo "The deploy of \`$SHA\` failed. Production runs the previous image if there was one (the deploy script rolls back on a failed health check); a migration that ran stays applied."
            echo
            [ -n "$pr" ] && echo "Merged through #$pr." && echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Last lines of the deploy log:"
            echo
            echo '```'
            tail -n 60 deploy.log 2>/dev/null || echo "(no deploy log: the job failed before the deploy step)"
            echo '```'
            echo
            echo "This issue is the task for the next session: find the cause, fix it in a PR."
          } > issue.md
          gh api "repos/$GITHUB_REPOSITORY/issues" \
            -f title="deploy failed: ${SHA:0:7}" -F "body=@issue.md" -f 'labels[]=deploy-failed' --jq .html_url
