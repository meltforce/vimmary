# A tag v* publishes the public image ghcr.io/meltforce/vimmary:<tag> and
# :latest and a GitHub release with the commits since the previous tag. The
# homelab deploys through deploy.yml, not from these images; they are for
# compose.example.yml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/meltforce/vimmary:${{ github.ref_name }}
            ghcr.io/meltforce/vimmary:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_SHA=${{ github.sha }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              echo "Changes since $prev"
              echo
              git log --pretty=format:'- %s (%h)' "${prev}..${TAG}"
            else
              echo "Initial release"
              echo
              git log --pretty=format:'- %s (%h)' "${TAG}"
            fi
            echo
            echo
            echo "---"
            echo
            echo "**Docker image:** \`ghcr.io/meltforce/vimmary:${TAG}\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
