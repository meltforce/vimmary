# Development stack: the app built from the working tree, and the database on
# port 5434 that the storage tests fall back to without TEST_DATABASE_URL.
services:
  app:
    build: .
    image: vimmary-local:dev
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/data/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      VIMMARY_DB_HOST: db
      VIMMARY_DB_PORT: "5432"

  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: vimmary
      POSTGRES_USER: vimmary
      POSTGRES_PASSWORD: vimmary
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vimmary"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
