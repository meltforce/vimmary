# Test database for scripts/test when TEST_DATABASE_URL is unset; Docker picks
# the host port, scripts/test reads it back. Production compose lives in the
# homelab repo.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: vimmary
      POSTGRES_PASSWORD: vimmary
      POSTGRES_DB: vimmary
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vimmary", "-d", "vimmary"]
      interval: 2s
      timeout: 2s
      retries: 30
