external_url: ""  # e.g. "https://vimmary.leo-royal.ts.net"

server:
  host: "0.0.0.0"
  port: 8080

database:
  host: "localhost"
  port: 5434
  name: "vimmary"
  user: "vimmary"

tailscale:
  enabled: false

search:
  default_threshold: 0.3
  default_limit: 10
  score_cutoff_ratio: 0.5

summary:
  provider: "claude"        # "claude" or "mistral"
  claude_model: "claude-sonnet-4-5-20250514"
  mistral_model: "mistral-large-latest"
  default_level: "medium"   # "medium" or "deep"

karakeep:
  base_url: "https://karakeep.leo-royal.ts.net"

youtube:
  sub_langs:
    - en
    - de

cast2md:
  enabled: false
  base_url: ""                # e.g. "https://cast2md.leo-royal.ts.net"
  poll_interval_minutes: 15   # an int, not "15m" — yaml.v3 does not decode durations
  max_per_poll: 25            # episodes queued per feed per tick
  timeout_seconds: 60         # transcript fetch; metadata calls use 15 s

secrets:
  postgres_password: "vimmary"
  mistral_api_key: ""
  claude_api_key: ""
