external_url: ""  # e.g. "https://vimmary.leo-royal.ts.net"

server:
  host: "0.0.0.0"
  port: 8080

database:
  host: "localhost"
  port: 5434
  name: "vimmary"
  user: "vimmary"

tailscale:
  enabled: false

search:
  default_threshold: 0.3
  default_limit: 10
  score_cutoff_ratio: 0.5

summary:
  # The initial provider. Once one is chosen in Settings → LLM providers, that
  # choice wins — this stays the value an unattended deployment starts from.
  # The API keys are not here: they live in the database and are entered in the
  # same page. Nothing in this file is fetched over the network at startup.
  provider: "claude"        # "claude" or "mistral"
  claude_model: "claude-sonnet-4-5-20250514"
  mistral_model: "mistral-large-latest"
  default_level: "medium"   # "medium" or "deep"

karakeep:
  base_url: "https://karakeep.leo-royal.ts.net"

youtube:
  sub_langs:
    - en
    - de

cast2md:
  enabled: false
  base_url: ""                # e.g. "https://cast2md.leo-royal.ts.net"
  poll_interval_minutes: 15   # an int, not "15m" — yaml.v3 does not decode durations
  max_per_poll: 25            # episodes queued per feed per tick
  timeout_seconds: 60         # transcript fetch; metadata calls use 15 s

# The database password is the only secret vimmary resolves at startup.
# VIMMARY_POSTGRES_PASSWORD in the environment takes precedence over the value
# here, which is what a deployment sets; the literal below is for local runs.
secrets:
  postgres_password: "vimmary"
